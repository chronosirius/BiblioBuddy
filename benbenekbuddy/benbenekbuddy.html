<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BenbenekBuddy</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="manifest" href="../site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="benbenekbuddy.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div>
          <a class="switch-mode-link" href="../index.html">Switch mode</a>
          <h1>BenbenekBuddy</h1>
          <p class="subtitle">Train stems and challenge your words of the day recall.</p>
        </div>
        <div class="hero-card">
          <p class="hero-label">Current Focus</p>
          <div id="focusCapsule" class="hero-mode">WWTW Learn</div>
          <p id="focusNote" class="hero-note"></p>
        </div>
      </header>

      <section class="mode-bar">
        <div class="mode-group">
          <button id="modeWwtw" class="mode-button active" type="button">Word Within the Word</button>
          <button id="modeWotd" class="mode-button" type="button">Words of the Day</button>
        </div>
      </section>

      <section id="wwtwControls" class="bb-panel">
        <div class="bb-tabs">
          <button id="tabLearn" class="mode-button active" type="button">Learn</button>
          <button id="tabPractice" class="mode-button" type="button">Practice</button>
        </div>

        <div id="learnControls" class="bb-control-row">
          <label class="bb-field">
            <span>List</span>
            <select id="learnListSelect"></select>
          </label>
          <p id="learnProgressText" class="bb-progress"></p>
        </div>

        <div id="practiceControls" class="bb-control-row" hidden>
          <label class="bb-field">
            <span>Scope</span>
            <select id="practiceScopeSelect">
              <option value="all">All mastered lists</option>
              <option value="one">One mastered list</option>
            </select>
          </label>
          <p id="practiceScopeHint" class="bb-progress"></p>
        </div>
      </section>

      <main class="layout">
        <section class="question-card">
          <div class="question-header">
            <div>
              <p id="questionMeta" class="question-meta"></p>
              <h2 id="questionTitle"></h2>
            </div>
          </div>
          <p id="questionPrompt" class="question-prompt"></p>

          <form id="answerForm" class="bb-answer-form">
            <label for="answerInput" class="bb-input-label">Your answer</label>
            <input id="answerInput" class="bb-input" type="text" autocomplete="off" />
            <div class="bb-actions">
              <button id="submitButton" class="primary-button" type="submit">Submit</button>
              <button id="nextButton" class="ghost-button" type="button" disabled>Next</button>
            </div>
          </form>

          <p id="feedback" class="feedback"></p>

          <section id="answerDetails" class="answer-details" aria-live="polite">
            <div class="answer-grid">
              <div class="detail-span">
                <p class="detail-label">Correct answer</p>
                <p id="detailAnswer" class="detail-value"></p>
              </div>
              <div class="detail-span">
                <p class="detail-label">Words</p>
                <p id="detailWords" class="detail-value"></p>
              </div>
              <div class="detail-span">
                <p class="detail-label">Language</p>
                <p id="detailLanguage" class="detail-value"></p>
              </div>
            </div>
          </section>
        </section>

        <aside class="stats">
          <div class="stats-card">
            <h3>WWTW Mastery</h3>
            <p id="masterySummary" class="limit-summary"></p>
            <div id="masteredLists" class="stats-grid"></div>
          </div>
          <div class="stats-card">
            <h3>Progress</h3>
            <p class="limit-note">Each stem is mastered after 3 correct answers in Learn mode.</p>
            <button id="resetProgress" class="ghost-button reset-button" type="button">Reset Benbenek progress</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="benbenekbuddy.js"></script>
    <script>
      (() => {
        const rainbowColors = ["#ff4d4d", "#ff8a3d", "#f7c948", "#53d769", "#4ca3ff", "#5b4dff"];

        function recolorBiblioText(root) {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodesToReplace = [];

          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (!node.textContent || !/biblio/gi.test(node.textContent)) {
              continue;
            }

            const parent = node.parentElement;
            if (!parent || parent.closest("h1") || parent.closest("title") || parent.closest(".biblio-rainbow")) {
              continue;
            }

            nodesToReplace.push(node);
          }

          nodesToReplace.forEach((node) => {
            const fragment = document.createDocumentFragment();
            const value = node.textContent;
            let lastIndex = 0;
            const regex = /biblio/gi;

            for (const match of value.matchAll(regex)) {
              const start = match.index;
              const end = start + match[0].length;

              if (start > lastIndex) {
                fragment.appendChild(document.createTextNode(value.slice(lastIndex, start)));
              }

              Array.from(match[0]).forEach((char, index) => {
                const span = document.createElement("span");
                span.textContent = char;
                span.className = "biblio-rainbow";
                span.style.color = rainbowColors[index % rainbowColors.length];
                fragment.appendChild(span);
              });

              lastIndex = end;
            }

            if (lastIndex < value.length) {
              fragment.appendChild(document.createTextNode(value.slice(lastIndex)));
            }

            node.replaceWith(fragment);
          });
        }

        recolorBiblioText(document.body);
      })();
    </script>
  </body>
</html>
