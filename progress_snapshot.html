<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiblioBuddy Progress Snapshot</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div>
          <a class="switch-mode-link" href="benbenekbuddy/benbenekbuddy.html">Switch mode</a>
          <h1>Progress Snapshot</h1>
          <p class="subtitle">Browse words by category and revisit any word card.</p>
        </div>
        <div class="hero-card">
          <p class="hero-label">Current Mode</p>
          <div id="modeCapsule" class="hero-mode">Definitions</div>
        </div>
      </header>

      <section class="mode-bar">
        <div class="mode-group">
          <button class="mode-button" data-mode="definitions">Definitions</button>
          <button class="mode-button" data-mode="synonyms">Synonyms</button>
          <button class="mode-button" data-mode="fitb">Fill in the Blank</button>
        </div>
        <a href="index.html" class="ghost-button back-button">Back to Quiz</a>
      </section>

      <main class="snapshot-layout">
        <section class="snapshot-column" id="categoryColumn"></section>
        <section class="word-card">
          <p class="question-meta">Word Card</p>
          <h2 id="cardWord">Select a word</h2>
          <section class="answer-details visible" aria-live="polite">
            <div class="answer-grid">
              <div>
                <p class="detail-label">Definitions</p>
                <ol id="cardDefinitions" class="detail-definitions"></ol>
              </div>
              <div class="detail-span">
                <p class="detail-label">Pronunciation</p>
                <div id="cardPronunciation" class="pronunciation-container"></div>
              </div>
              <div class="detail-span">
                <p class="detail-label">Synonyms</p>
                <ul id="cardSynonyms" class="detail-list"></ul>
              </div>
              <div class="detail-span">
                <p class="detail-label">Example sentences</p>
                <ul id="cardSentences" class="detail-list"></ul>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="progress_snapshot.js"></script>
    <script>
      (() => {
        const rainbowColors = ["#ff4d4d", "#ff8a3d", "#f7c948", "#53d769", "#4ca3ff", "#5b4dff"];

        function recolorBiblioText(root) {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodesToReplace = [];

          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (!node.textContent || !/biblio/gi.test(node.textContent)) {
              continue;
            }

            const parent = node.parentElement;
            if (!parent || parent.closest("h1") || parent.closest("title") || parent.closest(".biblio-rainbow")) {
              continue;
            }

            nodesToReplace.push(node);
          }

          nodesToReplace.forEach((node) => {
            const fragment = document.createDocumentFragment();
            const value = node.textContent;
            let lastIndex = 0;
            const regex = /biblio/gi;

            for (const match of value.matchAll(regex)) {
              const start = match.index;
              const end = start + match[0].length;

              if (start > lastIndex) {
                fragment.appendChild(document.createTextNode(value.slice(lastIndex, start)));
              }

              Array.from(match[0]).forEach((char, index) => {
                const span = document.createElement("span");
                span.textContent = char;
                span.className = "biblio-rainbow";
                span.style.color = rainbowColors[index % rainbowColors.length];
                fragment.appendChild(span);
              });

              lastIndex = end;
            }

            if (lastIndex < value.length) {
              fragment.appendChild(document.createTextNode(value.slice(lastIndex)));
            }

            node.replaceWith(fragment);
          });
        }

        recolorBiblioText(document.body);
      })();
    </script>
  </body>
</html>
